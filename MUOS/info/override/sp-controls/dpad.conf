# D-pad mode per ROM folder (or per game as folder/Name). stick = the D-pad
# drives the left analog stick, dpad = plain D-pad, stick+select-dpad =
# stick, but the real D-pad while SELECT is held. dpad+select-stick = the
# inverse (real D-pad at rest, stick while SELECT is held) — for flycast vl,
# whose stickless-handheld patch crosses the channels in-core, so this
# yields the same feel as stick+select-dpad elsewhere. Folders not listed
# keep the D-pad. Only folders that have an override script (n64, psp,
# dreamcast, psx) are affected; copy one of those scripts for another folder.
n64=stick
psp=stick+select-dpad
dreamcast=dpad+select-stick
psx=dpad
# psx/Ape Escape (USA)=stick
