# D-pad mode per ROM folder (or per game as folder/Name). stick = the D-pad
# drives the left analog stick, dpad = plain D-pad. Folders not listed keep
# the D-pad. Only folders that have an override script (n64, psp, dreamcast,
# psx) are affected; copy one of those scripts for another folder.
n64=stick
psp=stick
dreamcast=stick
psx=dpad
# psx/Ape Escape (USA)=stick
